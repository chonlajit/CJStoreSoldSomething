name: Ping Space (Keep Alive)

on:
  schedule:
    # รันทุกๆ 24 ชั่วโมง (เช่น 00:00 UTC หรือ 07:00 เวลาไทย)
    - cron: '0 0 * * *'
  workflow_dispatch: # อนุญาตให้กดรันแบบ manual จาก GitHub UI ได้

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit / HuggingFace Space
        # แก้ไข URL ด้านล่างเป็น URL จริงของแอปคุณ
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://cjstoresoldsomething-bbjdplgnoyyb4nqwk8jd5f.streamlit.app/
